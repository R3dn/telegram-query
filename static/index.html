<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram Query</title>
<style>
  :root {
    --bg: #0f1420; --panel: #171e2e; --panel2: #1d2639; --border: #2a3550;
    --text: #e8ecf4; --dim: #8b96ab; --accent: #4da3ff; --accent2: #7ee0b0;
    --warn: #ffb86b; --err: #ff7b7b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 14px 22px; background: var(--panel); border-bottom: 1px solid var(--border);
           display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; }
  #stats { color: var(--dim); font-size: 12px; }
  #sync-btn { margin-left: auto; }
  .wrap { display: grid; grid-template-columns: 380px 1fr; gap: 18px; padding: 18px 22px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin: 0 0 12px; }
  input, select, textarea, button {
    font-family: inherit; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; font-size: 14px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06121f; font-weight: 600; }
  button.primary:disabled { background: var(--panel2); color: var(--dim); }
  .row { display: flex; gap: 8px; margin-bottom: 10px; }
  .row > * { flex: 1; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  #ask-log { margin-top: 10px; font-size: 12px; color: var(--dim); min-height: 16px; }
  #ask-log .kw { color: var(--accent2); }
  #answer { margin-top: 12px; background: var(--panel2); border: 1px solid var(--border);
            border-radius: 8px; padding: 12px 14px; font-size: 14px; line-height: 1.6;
            text-align: start; min-height: 40px; }
  #answer p { margin: 0 0 8px; } #answer p:last-child { margin-bottom: 0; }
  #answer ul, #answer ol { margin: 6px 0; padding-inline-start: 22px; }
  #answer li { margin-bottom: 4px; }
  #answer code { background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
                 padding: 1px 5px; font-size: 13px; direction: ltr; unicode-bidi: embed; }
  #answer h4 { margin: 10px 0 6px; font-size: 14px; }
  #answer .cite { color: var(--accent2); font-weight: 600; }
  #answer .placeholder { color: var(--dim); font-style: italic; }
  .sources { margin-top: 10px; }
  .sources h3 { font-size: 12px; color: var(--dim); text-transform: uppercase; margin: 0 0 8px; }
  .msg { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
         padding: 10px 12px; margin-bottom: 8px; font-size: 13px; }
  .msg .meta { color: var(--dim); font-size: 11px; margin-bottom: 4px; display: flex; gap: 8px; flex-wrap: wrap; }
  .msg .meta .grp { color: var(--accent); }
  .msg .body { white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .msg .num { color: var(--accent2); font-weight: 700; }
  #search-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  #search-head h2 { margin: 0; flex: 1; }
  #count { color: var(--dim); font-size: 12px; }
  #sync-panel pre { font-size: 11px; color: var(--dim); background: var(--bg);
                    border-radius: 6px; padding: 8px; max-height: 220px; overflow: auto; margin: 8px 0 0; }
  .hint { font-size: 11px; color: var(--dim); margin-top: 6px; }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
  .dot-ok { background: var(--accent2); } .dot-run { background: var(--warn); } .dot-err { background: var(--err); }
</style>
</head>
<body>
<header>
  <h1>Telegram Query</h1>
  <span id="stats">loading…</span>
  <button id="sync-btn" onclick="startSync()">Sync now</button>
</header>

<div class="wrap">
  <!-- LEFT: filters + AI ask -->
  <div style="display:flex; flex-direction:column; gap:18px;">
    <div class="panel">
      <h2>Filters</h2>
      <div class="field">
        <label>Group</label>
        <select id="f-group" style="width:100%"><option value="">All groups</option></select>
      </div>
      <div class="row">
        <div class="field" style="margin:0">
          <label>From</label>
          <input type="date" id="f-from" style="width:100%">
        </div>
        <div class="field" style="margin:0">
          <label>To</label>
          <input type="date" id="f-to" style="width:100%">
        </div>
      </div>
      <div class="field">
        <label>Sender contains</label>
        <input id="f-sender" style="width:100%" placeholder="e.g. @dealsbot">
      </div>
      <div class="hint">Search tip: separate alternative words with | (e.g. <b>mcdonalds|ماكدونالدز</b>)</div>
    </div>

    <div class="panel">
      <h2>Ask AI</h2>
      <textarea id="question" rows="3" style="width:100%; resize:vertical"
        placeholder="e.g. what are the coupons for McDonald's this week?&#10;&#10;ما هي كوبونات مطعم اليوم؟"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="primary" id="ask-btn" onclick="askAI()">Ask</button>
      </div>
      <div id="ask-log"></div>
      <div id="answer"><span class="placeholder">Answer will appear here.</span></div>
    </div>

    <div class="panel" id="sync-panel" style="display:none">
      <h2>Sync log</h2>
      <pre id="sync-log"></pre>
    </div>
  </div>

  <!-- RIGHT: search + results -->
  <div class="panel">
    <div id="search-head">
      <input id="q" placeholder="Search messages…  (Enter)" style="flex:1" onkeydown="if(event.key==='Enter')doSearch()">
      <button class="primary" onclick="doSearch()">Search</button>
    </div>
    <div id="count"></div>
    <div id="results"></div>
  </div>
</div>

<script>
let aiConfigured = false;

async function loadStats() {
  const r = await (await fetch('/api/stats')).json();
  aiConfigured = r.ai_configured;
  const last = r.last_message ? r.last_message.slice(0,10) : 'never';
  document.getElementById('stats').textContent =
    `${r.messages} messages · ${r.chats} groups · last: ${last}` +
    (r.ai_configured ? '' : ' · AI not configured');
}

async function loadGroups() {
  const groups = await (await fetch('/api/groups')).json();
  const sel = document.getElementById('f-group');
  sel.innerHTML = '<option value="">All groups</option>' +
    groups.map(g => `<option value="${g.chat_id}">${esc(g.title)}</option>`).join('');
}

function esc(s) {
  return (s ?? '').toString().replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Minimal, safe Markdown renderer for AI answers: bold, inline code,
// lists, [n] citations, headings, paragraphs. All text is HTML-escaped.
function mdToHtml(md) {
  const inline = t => esc(t)
    .replace(/\[({?\d+}?)\]/g, '<span class="cite">[$1]</span>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
  const lines = (md ?? '').replace(/\r/g, '').split('\n');
  let html = '', inList = null;   // null | 'ul' | 'ol'
  const closeList = () => { if (inList) { html += `</${inList}>`; inList = null; } };
  for (const raw of lines) {
    const line = raw.trimEnd();
    if (/^(\s*)([-*])\s+/.test(line)) {
      if (inList !== 'ul') { closeList(); html += '<ul>'; inList = 'ul'; }
      html += '<li>' + inline(line.replace(/^\s*[-*]\s+/, '')) + '</li>';
    } else if (/^(\s*)\d+[.)]\s+/.test(line)) {
      if (inList !== 'ol') { closeList(); html += '<ol>'; inList = 'ol'; }
      html += '<li>' + inline(line.replace(/^\s*\d+[.)]\s+/, '')) + '</li>';
    } else if (/^#{1,4}\s+/.test(line)) {
      closeList(); html += '<h4>' + inline(line.replace(/^#{1,4}\s+/, '')) + '</h4>';
    } else if (line.trim() === '') {
      closeList(); html += '</p>';
    } else {
      if (html === '' || html.endsWith('</p>') || html.endsWith('</ul>') || html.endsWith('</ol>')) html += '<p>';
      html += inline(line) + ' ';
    }
  }
  closeList();
  return html.replace(/<p>\s*<\/p>/g, '').replace(/<\/p>(?=\S)/g, '</p>');
}

function msgHTML(m, n) {
  const d = (m.date || '').slice(0, 16).replace('T', ' ');
  return `<div class="msg" dir="auto">
    <div class="meta"><span class="num">[${n ?? ''}]</span>
      <span class="grp">${esc(m.chat_title)}</span>
      <span>${d}</span><span>${esc(m.sender_name || '')}</span>
      ${m.edited ? '<span>(edited)</span>' : ''}${m.has_media ? '<span>🖼</span>' : ''}
    </div>
    <div class="body">${esc(m.text)}</div>
  </div>`;
}

async function doSearch() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const p = new URLSearchParams({
    q,
    group: document.getElementById('f-group').value || '',
    sender: document.getElementById('f-sender').value.trim(),
    from_: document.getElementById('f-from').value,
    to: document.getElementById('f-to').value,
  });
  const rows = await (await fetch('/api/search?' + p)).json();
  document.getElementById('count').textContent = `${rows.length} results`;
  document.getElementById('results').innerHTML =
    rows.map((m, i) => msgHTML(m, i + 1)).join('') ||
    '<div class="msg"><div class="body">No results.</div></div>';
}

async function askAI() {
  const q = document.getElementById('question').value.trim();
  if (!q) return;
  if (!aiConfigured) {
    document.getElementById('answer').innerHTML =
      '<span class="placeholder">AI not configured - set AI_API_KEY in .env</span>';
    return;
  }
  const btn = document.getElementById('ask-btn');
  btn.disabled = true; btn.textContent = 'Asking…';
  document.getElementById('ask-log').textContent = '';
  document.getElementById('answer').innerHTML = '<span class="placeholder">Thinking…</span>';
  document.getElementById('results').innerHTML = '';
  try {
    const r = await (await fetch('/api/ask', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q}),
    })).json();
    if (r.error) throw new Error(r.error);
    const kw = (r.keywords_tried || []).map(k => `<span class="kw">${k.map(esc).join(', ')}</span>`).join(' → ');
    document.getElementById('ask-log').innerHTML =
      `searched: ${kw || '—'} · attempts: ${r.attempts}`;
    document.getElementById('answer').innerHTML = mdToHtml(r.answer || '');
    const n = (r.sources || []).length;
    document.getElementById('count').textContent = n ? `${n} sources used` : '';
    document.getElementById('results').innerHTML =
      (r.sources || []).map((m, i) => msgHTML(m, i + 1)).join('');
  } catch (e) {
    document.getElementById('answer').innerHTML =
      '<span style="color:var(--err)">' + esc(e.message) + '</span>';
  } finally {
    btn.disabled = false; btn.textContent = 'Ask';
  }
}

async function startSync() {
  const r = await (await fetch('/api/sync', {method: 'POST'})).json();
  if (r.error) { alert(r.error); return; }
  document.getElementById('sync-panel').style.display = 'block';
  document.getElementById('sync-log').textContent = 'starting…';
  pollSync();
}
async function pollSync() {
  const s = await (await fetch('/api/sync/status')).json();
  document.getElementById('sync-log').textContent = s.log || '(starting…)';
  document.getElementById('sync-btn').disabled = s.running;
  const dot = s.running ? '<span class="status-dot dot-run"></span>' :
    (s.ok === true ? '<span class="status-dot dot-ok"></span>' :
     s.ok === false ? '<span class="status-dot dot-err"></span>' : '');
  document.getElementById('stats').innerHTML = 'sync ' + dot;
  if (s.running) { setTimeout(pollSync, 1500); return; }
  await loadStats(); await loadGroups();
  document.getElementById('stats').innerHTML = dot + ' sync done';
}

loadStats(); loadGroups();
</script>
</body>
</html>
