<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram Query</title>
<style>
  :root {
    --bg: #0f1420; --panel: #171e2e; --panel2: #1d2639; --border: #2a3550;
    --text: #e8ecf4; --dim: #8b96ab; --accent: #4da3ff; --accent2: #7ee0b0;
    --warn: #ffb86b; --err: #ff7b7b;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }  /* author display rules must not defeat hiding */
  html, body { height: 100%; }
  body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: var(--bg);
         color: var(--text); display: flex; flex-direction: column; overflow: hidden; }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
           background: var(--panel); border-bottom: 1px solid var(--border); flex: none; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; white-space: nowrap; }
  #stats { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1; }

  /* ---------- buttons / inputs ---------- */
  button { font-family: inherit; }
  .primary-btn { background: var(--accent); border: none; color: #06121f; font-weight: 600;
                 border-radius: 7px; padding: 8px 14px; cursor: pointer; font-size: 13px; }
  .primary-btn:hover { filter: brightness(1.1); }
  .primary-btn:disabled { opacity: .5; cursor: default; }
  .ghost-btn { background: transparent; border: 1px solid var(--border); color: var(--text);
               border-radius: 7px; padding: 7px 12px; cursor: pointer; font-size: 13px; }
  .ghost-btn:hover { border-color: var(--accent); }
  .ghost-btn.sm { padding: 5px 10px; font-size: 12px; }
  .danger-btn { background: transparent; border: 1px solid var(--err); color: var(--err);
                border-radius: 7px; padding: 7px 12px; cursor: pointer; font-size: 13px; }
  .danger-btn:hover { background: rgba(255,123,123,.1); }
  .icon-btn { background: transparent; border: none; color: var(--dim); cursor: pointer;
              font-size: 16px; padding: 6px 8px; border-radius: 6px; line-height: 1; }
  .icon-btn:hover { color: var(--text); background: var(--panel2); }
  select, input, textarea { background: var(--panel2); border: 1px solid var(--border); color: var(--text);
           border-radius: 7px; padding: 7px 9px; font-family: inherit; font-size: 13px; }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  input[type="date"] { color-scheme: dark; }

  .seg { display: inline-flex; background: var(--panel2); border: 1px solid var(--border);
         border-radius: 8px; overflow: hidden; }
  .seg button { background: transparent; border: none; color: var(--dim); padding: 7px 14px;
                cursor: pointer; font-size: 13px; }
  .seg button.on { background: var(--accent); color: #06121f; font-weight: 600; }
  .chips { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .chips button { background: var(--panel2); border: 1px solid var(--border); color: var(--dim);
                  border-radius: 999px; padding: 4px 12px; font-size: 12px; cursor: pointer; }
  .chips button.on { background: var(--accent); border-color: var(--accent); color: #06121f; font-weight: 600; }

  /* ---------- layout ---------- */
  #layout { flex: 1; display: grid; grid-template-columns: 280px minmax(0,1fr) 360px; min-height: 0; }

  /* ---------- sidebar ---------- */
  #sidebar { background: var(--panel); border-right: 1px solid var(--border);
             display: flex; flex-direction: column; min-height: 0; }
  .side-search { padding: 10px; }
  .side-search input { width: 100%; }
  #group-list-wrap { flex: 1; overflow-y: auto; padding: 4px 0 8px; }
  .group-row { display: flex; gap: 9px; align-items: center; padding: 9px 10px;
               border-radius: 8px; cursor: pointer; margin: 1px 8px; }
  .group-row:hover { background: var(--panel2); }
  .group-row.on { background: rgba(77,163,255,.12); box-shadow: inset 2px 0 0 var(--accent); }
  .g-ic { font-size: 15px; flex: none; }
  .g-main { flex: 1; min-width: 0; }
  .g-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .g-meta { font-size: 11px; color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side-empty { color: var(--dim); font-size: 12px; padding: 14px; text-align: center; }
  .side-foot { padding: 10px 14px; font-size: 11px; color: var(--dim);
               border-top: 1px solid var(--border); flex: none; }

  /* ---------- feed column ---------- */
  #feed-col { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #filter-bar { flex: none; padding: 10px 16px; background: var(--panel);
                border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .fb-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #search-wrap { flex: 1; min-width: 220px; display: flex; }
  #q { width: 100%; }
  #date-custom { display: none; gap: 6px; align-items: center; font-size: 12px; color: var(--dim); }
  #scope-line { font-size: 11px; color: var(--dim); }

  #feed { flex: 1; overflow-y: auto; min-height: 0; padding-bottom: 30px; }
  .day-sep { position: sticky; top: 0; z-index: 5; display: flex; justify-content: center;
             padding: 7px 0; background: linear-gradient(var(--bg) 65%, transparent); }
  .day-sep span { background: var(--panel2); border: 1px solid var(--border); color: var(--dim);
                  font-size: 11px; padding: 2px 12px; border-radius: 999px; }
  .msg-card { padding: 9px 18px 10px; cursor: pointer; }
  .msg-card:hover { background: var(--panel); }
  .msg-card.active { background: rgba(77,163,255,.10); box-shadow: inset 3px 0 0 var(--accent); }
  .msg-head { display: flex; gap: 8px; align-items: baseline; font-size: 11px; color: var(--dim);
              margin-bottom: 3px; flex-wrap: wrap; }
  .msg-sender { font-size: 13px; color: var(--accent); font-weight: 600; max-width: 45%;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg-time { font-variant-numeric: tabular-nums; }
  .msg-grp { background: var(--panel2); border-radius: 6px; padding: 0 7px; line-height: 17px; }
  .badge { opacity: .8; }
  .msg-body { font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  mark { background: rgba(77,163,255,.28); color: inherit; border-radius: 3px; padding: 0 2px; }
  .num { color: var(--accent2); font-weight: 700; }

  .feed-empty { padding: 70px 20px; text-align: center; color: var(--dim); font-size: 14px; }
  .fe-ic { font-size: 34px; margin-bottom: 10px; opacity: .6; }
  .skel-msg { padding: 12px 18px; }
  .skel { height: 12px; border-radius: 6px; margin: 7px 0;
          background: linear-gradient(90deg, var(--panel2) 25%, var(--border) 50%, var(--panel2) 75%);
          background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
  .skel.l1 { width: 40%; } .skel.l2 { width: 92%; } .skel.l3 { width: 70%; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  #feed-foot { position: absolute; bottom: 8px; left: 0; right: 0; display: flex;
               flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 6; }
  #feed-foot > * { pointer-events: auto; }
  #feed-loader { display: none; color: var(--dim); font-size: 12px;
                 background: var(--panel2); border-radius: 999px; padding: 4px 14px; }
  #feed-loader.show { display: block; }
  #load-more { display: none; background: var(--panel2); border: 1px solid var(--border); color: var(--dim);
               border-radius: 999px; padding: 5px 16px; font-size: 12px; cursor: pointer; }
  #load-more:hover { color: var(--text); border-color: var(--accent); }
  #jump-top { position: absolute; right: 18px; bottom: 18px; width: 40px; height: 40px;
              border-radius: 50%; background: var(--accent); color: #06121f; border: none;
              font-size: 16px; cursor: pointer; display: none; align-items: center;
              justify-content: center; box-shadow: 0 4px 14px rgba(0,0,0,.35); z-index: 8; }
  #jump-top.show { display: flex; }

  /* ---------- right panel ---------- */
  #right-panel { background: var(--panel); border-left: 1px solid var(--border);
                 display: flex; flex-direction: column; min-height: 0; }
  .rp-tabs { display: flex; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--border);
             align-items: center; flex: none; }
  .rp-tab { background: transparent; border: none; color: var(--dim); padding: 6px 12px;
            font-size: 13px; border-radius: 6px; cursor: pointer; }
  .rp-tab.on { background: var(--panel2); color: var(--text); font-weight: 600; }
  #rp-close { margin-left: auto; }
  .rp-body { padding: 14px; overflow-y: auto; flex: 1; min-height: 0; }
  #question { width: 100%; resize: vertical; margin-bottom: 10px; }
  #ask-log { margin-bottom: 10px; font-size: 12px; color: var(--dim); min-height: 16px; }
  #ask-log .kw { color: var(--accent2); }
  #answer { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
            padding: 12px 14px; font-size: 14px; line-height: 1.6; text-align: start; min-height: 40px; }
  #answer p { margin: 0 0 8px; } #answer p:last-child { margin-bottom: 0; }
  #answer ul, #answer ol { margin: 6px 0; padding-inline-start: 22px; }
  #answer li { margin-bottom: 4px; }
  #answer code { background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
                 padding: 1px 5px; font-size: 13px; direction: ltr; unicode-bidi: embed; }
  #answer h4 { margin: 10px 0 6px; font-size: 14px; }
  #answer .cite { color: var(--accent2); font-weight: 600; }
  #answer .placeholder, .placeholder { color: var(--dim); font-style: italic; }
  .sources h3 { font-size: 12px; color: var(--dim); text-transform: uppercase; margin: 14px 0 8px; }
  .msg-card.mini { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
                   padding: 8px 10px; margin-bottom: 8px; font-size: 12px; }
  .msg-card.mini .msg-body { font-size: 12px; max-height: 60px; overflow: hidden; }
  #detail-text { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
                 padding: 12px 14px; font-size: 14px; line-height: 1.6; white-space: pre-wrap;
                 word-break: break-word; margin-bottom: 12px; }
  #detail-meta { font-size: 12px; }
  #detail-meta div { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); }
  #detail-meta span { color: var(--dim); width: 60px; flex: none; }
  .rp-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .hint { font-size: 11px; color: var(--dim); margin-top: 6px; }

  /* ---------- sync drawer ---------- */
  #sync-drawer { position: fixed; left: 16px; bottom: 16px; width: min(460px, calc(100vw - 32px));
                 background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
                 z-index: 90; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .sd-head { display: flex; justify-content: space-between; align-items: center;
             padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; }
  #sync-log { margin: 0; padding: 10px 14px; max-height: 220px; overflow: auto; font-size: 11px;
             color: var(--dim); font-family: Consolas, monospace; white-space: pre-wrap; }
  #sd-queued { padding: 8px 14px 0; font-size: 11px; color: var(--warn); }
  #sd-queued:empty { padding: 0; }

  /* ---------- manage modal ---------- */
  #manage-overlay { position: fixed; inset: 0; background: rgba(4,8,18,.6); backdrop-filter: blur(3px);
                    display: flex; align-items: center; justify-content: center; z-index: 100; }
  #manage-modal { width: min(640px, 94vw); max-height: 84vh; display: flex; flex-direction: column;
                  background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
  .mm-head { display: flex; justify-content: space-between; align-items: center;
             padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .mm-head h3 { margin: 0; font-size: 15px; }
  #mm-body { overflow-y: auto; padding: 8px 14px; flex: 1; min-height: 120px; }
  .mm-row { display: flex; gap: 10px; align-items: center; padding: 10px 8px;
            border-radius: 8px; cursor: pointer; }
  .mm-row:hover { background: var(--panel2); }
  .mm-badge { font-size: 11px; color: var(--accent2); border: 1px solid var(--accent2);
              padding: 1px 8px; border-radius: 10px; flex: none; }
  .mm-loading { color: var(--dim); font-size: 13px; padding: 30px 10px; text-align: center; }
  .mm-foot { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .mm-sec { font-size: 11px; color: var(--dim); text-transform: uppercase;
            letter-spacing: 1px; margin: 12px 2px 6px; font-weight: 600; }
  .mm-progress { display: flex; gap: 12px; align-items: flex-start; padding: 12px;
                 background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; }
  .mm-progress > div { flex: 1; min-width: 0; }
  .mm-note { font-size: 12px; color: var(--text); margin-bottom: 6px; }
  #mm-log { margin: 0; max-height: 110px; overflow: auto; font-size: 11px; color: var(--dim);
            font-family: Consolas, monospace; background: var(--bg); border-radius: 6px;
            padding: 8px; white-space: pre-wrap; }
  .spinner { display: inline-block; width: 14px; height: 14px; flex: none;
             border: 2px solid var(--border); border-top-color: var(--accent);
             border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .mm-load-wrap { padding: 18px; text-align: center; }
  .mm-untrack, .stop-btn { background: transparent; border: 1px solid var(--err); color: var(--err);
                           border-radius: 6px; padding: 3px 9px; font-size: 11px; cursor: pointer; flex: none; }
  .mm-untrack:hover, .stop-btn:hover { background: rgba(255,123,123,.1); }
  .mm-untrack.armed { background: rgba(255,123,123,.25); font-weight: 700; }
  .sd-head .spinner { margin-left: 8px; }

  /* ---------- toasts ---------- */
  #toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column;
            gap: 8px; z-index: 200; }
  .toast { background: var(--panel2); border: 1px solid var(--border); border-left: 3px solid var(--accent);
           padding: 10px 14px; border-radius: 8px; font-size: 13px; max-width: 340px;
           box-shadow: 0 6px 24px rgba(0,0,0,.35); animation: slidein .18s ease; }
  .toast.ok { border-left-color: var(--accent2); }
  .toast.err { border-left-color: var(--err); }
  .toast.out { opacity: 0; transform: translateY(6px); transition: .3s; }
  @keyframes slidein { from { opacity: 0; transform: translateY(6px); } }

  /* ---------- desktop: hide right panel via toggle ---------- */
  body.rp-off #layout { grid-template-columns: 280px minmax(0,1fr); }
  body.rp-off #right-panel { display: none; }
  #nav-toggle { display: none; }

  /* ---------- responsive ---------- */
  @media (max-width: 1100px) {
    #layout { grid-template-columns: 280px minmax(0,1fr); }
    #right-panel { position: fixed; top: 57px; right: 0; bottom: 0; width: min(380px, 92vw);
                   transform: translateX(105%); transition: transform .2s; z-index: 40;
                   box-shadow: -8px 0 30px rgba(0,0,0,.4); }
    body.rp-on #right-panel { transform: none; }
  }
  @media (max-width: 800px) {
    #layout { grid-template-columns: minmax(0,1fr); }
    #sidebar { position: fixed; top: 57px; left: 0; bottom: 0; width: min(300px, 85vw);
               transform: translateX(-105%); transition: transform .2s; z-index: 40;
               box-shadow: 8px 0 30px rgba(0,0,0,.4); }
    body.sb-on #sidebar { transform: none; }
    #nav-toggle { display: inline-flex; }
    #stats { display: none; }
  }

  /* ---------- scrollbars ---------- */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--dim); }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<header>
  <button id="nav-toggle" class="icon-btn" title="Groups">☰</button>
  <h1>Telegram Query</h1>
  <span id="stats">loading…</span>
  <span class="spacer"></span>
  <button id="manage-btn" class="ghost-btn">Manage groups</button>
  <button id="sync-btn" class="primary-btn">Sync now</button>
  <button id="right-toggle" class="icon-btn" title="Toggle AI / details panel">🤖</button>
</header>

<div id="layout">
  <!-- LEFT: group sidebar -->
  <aside id="sidebar">
    <div class="side-search"><input id="group-filter" placeholder="Filter groups…"></div>
    <div id="group-list-wrap">
      <div class="group-row" id="row-all" title="Show messages from every tracked group">
        <span class="g-ic">🌐</span>
        <div class="g-main">
          <div class="g-title">All groups</div>
          <div class="g-meta">unified feed</div>
        </div>
      </div>
      <div id="group-list"></div>
    </div>
    <div class="side-foot" id="side-foot"></div>
  </aside>

  <!-- CENTER: filters + message feed -->
  <main id="feed-col">
    <div id="filter-bar">
      <div class="fb-row">
        <div class="seg" id="mode-seg">
          <button data-mode="browse" class="on">Browse</button>
          <button data-mode="search">Search</button>
        </div>
        <div id="search-wrap">
          <input id="q" placeholder="Search messages…  (Enter or /)">
        </div>
      </div>
      <div class="fb-row">
        <div class="chips" id="date-chips">
          <button data-chip="all" class="on">All time</button>
          <button data-chip="today">Today</button>
          <button data-chip="7d">7 days</button>
          <button data-chip="30d">30 days</button>
          <button data-chip="custom">📅 Custom</button>
        </div>
        <div id="date-custom">
          <input type="date" id="f-from" title="From"><span>→</span><input type="date" id="f-to" title="To">
        </div>
        <select id="f-sender" title="Sender"><option value="">Any sender</option></select>
        <select id="f-media" title="Message type">
          <option value="">Any type</option>
          <option value="1">With images</option>
          <option value="0">Text only</option>
        </select>
        <select id="f-sort" title="Sort">
          <option value="desc">Newest first</option>
          <option value="asc">Oldest first</option>
        </select>
        <button id="clear-filters" class="ghost-btn sm">Clear</button>
      </div>
      <div id="scope-line"></div>
    </div>
    <div id="feed"></div>
    <div id="feed-foot">
      <div id="feed-loader">loading…</div>
      <button id="load-more">Load older messages</button>
    </div>
    <button id="jump-top" title="Jump to latest">↑</button>
  </main>

  <!-- RIGHT: AI + details -->
  <aside id="right-panel">
    <div class="rp-tabs">
      <button class="rp-tab on" data-tab="ask">Ask AI</button>
      <button class="rp-tab" data-tab="details">Details</button>
      <button id="rp-close" class="icon-btn" title="Close panel">✕</button>
    </div>
    <div id="tab-ask" class="rp-body">
      <textarea id="question" rows="4"
        placeholder="Ask anything about your groups — deals, car talk, discussions…&#10;&#10;e.g. what problems do Haval H6 owners report? · what coupons were posted this week?"></textarea>
      <button id="ask-btn" class="primary-btn" style="width:100%">Ask</button>
      <div class="hint">Ctrl+Enter to ask. Answers cite messages as [n].</div>
      <div id="ask-log"></div>
      <div id="answer"><span class="placeholder">Answer will appear here.</span></div>
      <div id="sources" class="sources"></div>
    </div>
    <div id="tab-details" class="rp-body" hidden>
      <div id="detail-empty" class="placeholder">Click a message in the feed to see its details.</div>
      <div id="detail" hidden>
        <div id="detail-text" dir="auto"></div>
        <div id="detail-meta"></div>
        <div class="rp-actions">
          <button id="detail-copy" class="ghost-btn sm">Copy text</button>
          <button id="detail-sender" class="ghost-btn sm">Messages from this sender</button>
        </div>
      </div>
    </div>
  </aside>
</div>

<!-- sync / job drawer -->
<div id="sync-drawer" hidden>
  <div class="sd-head"><span style="display:flex;align-items:center"><span id="sd-title">Job log</span><span id="sd-spin" class="spinner" style="display:none"></span></span><span style="display:flex;align-items:center;gap:6px"><button id="sd-stop" class="stop-btn" style="display:none">■ stop</button><button id="sd-close" class="icon-btn">✕</button></span></div>
  <div id="sd-queued"></div>
  <pre id="sync-log"></pre>
</div>

<!-- manage groups modal -->
<div id="manage-overlay" hidden>
  <div id="manage-modal">
    <div class="mm-head"><h3>Manage groups</h3><button id="mm-close" class="icon-btn">✕</button></div>
    <div id="mm-body">
      <div class="mm-sec">Tracked groups</div>
      <div id="mm-tracked"></div>
      <div class="mm-sec">Telegram groups not tracked yet</div>
      <div id="mm-dialogs"></div>
    </div>
    <div class="mm-foot">
      <button id="mm-track" class="primary-btn">Track selected</button>
      <button id="mm-refresh" class="ghost-btn">Reload Telegram list</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const S = {
  groups: [],            // tracked groups with stats
  selected: new Set(),   // chat_ids; empty = all groups
  mode: 'browse',        // 'browse' | 'search'
  q: '',
  chip: 'all',
  from: '', to: '', sender: '', media: '', sort: 'desc',
  feed: [], cursor: null, hasMore: false, loading: false,
  aiSources: [],
};
const FEED_LIMIT = 50;
let lastDay = null;
let currentDetail = null;
let pollTimer = null;
let manageOpen = false;
let dialogs = null;      // last loaded dialog list for the manage modal
let aiConfigured = false;

// ---------------------------------------------------------------------------
// Small helpers
// ---------------------------------------------------------------------------
function esc(s) {
  return (s ?? '').toString().replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function fmtDate(iso) { return (iso || '').slice(0, 10); }
function fmtDateTime(iso) { return (iso || '').slice(0, 16).replace('T', ' '); }
function isoDay(d) { return new Date(d).toISOString().slice(0, 10); }
function dayLabel(day) {
  try {
    const dt = new Date(day + 'T12:00:00Z');
    return dt.toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
  } catch (e) { return day; }
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

function toast(msg, type = 'info', ms = 3500) {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, ms);
}

// Stats + groups sidebar

async function loadStats() {
  try {
    const r = await (await fetch('/api/stats')).json();
    aiConfigured = r.ai_configured;
    const last = r.last_message ? fmtDate(r.last_message) : 'never';
    const pending = r.pending_backfills
      ? ` · ${r.pending_backfills} backfill${r.pending_backfills > 1 ? 's' : ''} pending` : '';
    $('stats').textContent =
      `${(r.messages || 0).toLocaleString()} messages · ${r.chats} groups · last: ${last}` +
      pending + (r.ai_configured ? '' : ' · AI not configured');
  } catch (e) { /* server down? */ }
}

let groupsError = false;

async function loadGroups() {
  try {
    const groups = await (await fetch('/api/groups')).json();
    S.groups = groups || [];
    groupsError = false;
  } catch (e) { groupsError = true; }
  const ids = new Set(S.groups.map(g => g.chat_id));
  for (const id of [...S.selected]) if (!ids.has(id)) S.selected.delete(id);
  renderGroups();
  if (!groupsError) loadSenders();
}

function renderGroups() {
  const f = ($('group-filter').value || '').trim().toLowerCase();
  const rows = S.groups.filter(g => !f || (g.title || '').toLowerCase().includes(f));
  $('group-list').innerHTML = rows.map(g => {
    const on = S.selected.has(g.chat_id);
    const ic = g.kind === 'channel' ? '📣' : '👥';
    const count = (g.message_count || 0).toLocaleString();
    const last = g.last_message ? ' · ' + fmtDate(g.last_message) : '';
    return `<div class="group-row ${on ? 'on' : ''}" data-id="${g.chat_id}">
      <input type="checkbox" ${on ? 'checked' : ''} tabindex="-1">
      <span class="g-ic">${ic}</span>
      <div class="g-main">
        <div class="g-title" dir="auto">${esc(g.title)}</div>
        <div class="g-meta">${count} msgs${last}</div>
      </div>
    </div>`;
  }).join('') || '<div class="side-empty">No groups match.</div>';
  const n = S.selected.size;
  $('row-all').classList.toggle('on', n === 0);
  $('side-foot').textContent = n
    ? `${n} of ${S.groups.length} selected`
    : `${S.groups.length} groups tracked`;
}

async function loadSenders() {
  const p = new URLSearchParams();
  if (S.selected.size) p.set('groups', [...S.selected].join(','));
  const list = await (await fetch('/api/senders?' + p)).json();
  const cur = S.sender;
  $('f-sender').innerHTML = '<option value="">Any sender</option>' +
    (list || []).map(s =>
      `<option value="${esc(s.sender_name)}" ${s.sender_name === cur ? 'selected' : ''}>` +
      `${esc(s.sender_name)} (${s.count})</option>`).join('');
  if (cur && !(list || []).some(s => s.sender_name === cur)) S.sender = '';
}

function onScopeChange() {
  loadSenders();
  loadFeed(true);
}

// ---------------------------------------------------------------------------
// Feed
// ---------------------------------------------------------------------------
function feedURL(reset) {
  const p = new URLSearchParams();
  if (S.selected.size) p.set('groups', [...S.selected].join(','));
  if (S.from) p.set('from_', S.from);
  if (S.to) p.set('to', S.to);
  if (S.sender) p.set('sender', S.sender);
  if (S.media !== '') p.set('media', S.media);
  if (S.mode === 'search') {
    p.set('q', S.q);
    p.set('limit', '200');
  } else {
    p.set('sort', S.sort);
    p.set('limit', String(FEED_LIMIT));
    if (!reset && S.cursor) p.set('cursor', S.cursor);
  }
  return p;
}

async function loadFeed(reset = true) {
  if (S.loading) return;
  S.loading = true;
  if (reset) {
    S.feed = []; S.cursor = null; S.hasMore = false; lastDay = null;
    $('feed').innerHTML = skeletonHTML();
  }
  if (reset) $('feed-loader').classList.add('show');
  try {
    if (S.mode === 'search' && !S.q) {
      S.feed = []; S.hasMore = false;
      $('feed').innerHTML = emptyHTML('Type in the search box to find messages.<br>Tip: separate alternatives with <b>|</b> (e.g. mcdonalds|ماكدونالدز)');
    } else if (S.mode === 'search') {
      let rows = await (await fetch('/api/search?' + feedURL(reset))).json();
      rows = rows.slice().sort((a, b) => S.sort === 'asc' ? (a.date < b.date ? -1 : 1) : (a.date > b.date ? -1 : 1));
      applyRows(rows, reset, true);
      S.hasMore = false; S.cursor = null;
    } else {
      const r = await (await fetch('/api/messages?' + feedURL(reset))).json();
      applyRows(r.messages || [], reset, false);
      S.cursor = r.next_cursor; S.hasMore = r.has_more;
    }
  } catch (e) {
    toast('Load failed: ' + e.message, 'err');
  } finally {
    S.loading = false;
    $('feed-loader').classList.remove('show');
    updateScopeLine(); updateLoadMore();
  }
}

function applyRows(rows, reset, isSearch) {
  if (reset) $('feed').innerHTML = '';
  if (!rows.length && reset) {
    $('feed').innerHTML = emptyHTML(isSearch
      ? `No results for “${esc(S.q)}”. Try different wording or fewer filters.`
      : 'No messages match the current filters.');
    return;
  }
  const multi = S.selected.size !== 1;
  const hl = isSearch ? highlightRegex() : null;
  const html = [];
  for (const m of rows) {
    if (!isSearch) {
      const day = (m.date || '').slice(0, 10);
      if (day !== lastDay) { html.push(daySepHTML(day)); lastDay = day; }
    }
    S.feed.push(m);
    html.push(cardHTML(m, multi, hl));
  }
  $('feed').insertAdjacentHTML('beforeend', html.join(''));
}

function cardHTML(m, multi, hl) {
  const key = `${m.chat_id}:${m.msg_id}`;
  const time = (m.date || '').slice(11, 16);
  const badges = (m.edited ? ' <span class="badge" title="edited">✎</span>' : '') +
                 (m.has_media ? ' <span class="badge" title="has image">🖼</span>' : '');
  let body = esc(m.text || '');
  if (hl) body = body.replace(hl, '<mark>$&</mark>');
  return `<div class="msg-card" data-key="${key}">
    <div class="msg-head">
      <span class="msg-sender" dir="auto">${esc(m.sender_name || 'unknown')}</span>
      <span class="msg-time">${time}</span>
      ${multi ? `<span class="msg-grp" dir="auto">${esc(m.chat_title)}</span>` : ''}
      ${badges}
    </div>
    <div class="msg-body" dir="auto">${body}</div>
  </div>`;
}

function daySepHTML(day) {
  return `<div class="day-sep"><span>${esc(dayLabel(day))}</span></div>`;
}

function skeletonHTML() {
  let out = '';
  for (let i = 0; i < 7; i++) out += '<div class="skel-msg"><div class="skel l1"></div><div class="skel l2"></div><div class="skel l3"></div></div>';
  return out;
}

function emptyHTML(text) {
  return `<div class="feed-empty"><div class="fe-ic">🗂</div><div>${text}</div></div>`;
}

function highlightRegex() {
  const phrases = S.q.split('|').map(p => p.trim()).filter(p => p.length >= 2);
  if (!phrases.length) return null;
  try { return new RegExp('(' + phrases.map(escRe).join('|') + ')', 'gi'); }
  catch (e) { return null; }
}

function updateScopeLine() {
  const bits = [];
  bits.push(S.mode === 'search' ? `search “${S.q}”` : 'browse');
  bits.push(S.selected.size === 0 ? 'all groups' : `${S.selected.size} group${S.selected.size > 1 ? 's' : ''}`);
  if (S.from) bits.push('from ' + S.from);
  if (S.to) bits.push('to ' + S.to);
  if (S.sender) bits.push('sender: ' + S.sender);
  if (S.media === '1') bits.push('with images');
  if (S.media === '0') bits.push('text only');
  $('scope-line').textContent =
    `${S.feed.length} shown · ` + bits.join(' · ') + (S.hasMore ? ' · more on scroll' : '');
}

function updateLoadMore() {
  $('load-more').style.display = (S.mode === 'browse' && S.hasMore) ? 'block' : 'none';
}

function setDateChip(chip) {
  S.chip = chip;
  if (chip === 'all') {
    S.from = ''; S.to = '';
  } else if (chip !== 'custom') {
    const now = new Date();
    const to = isoDay(now);
    let from = to;
    if (chip === '7d') from = isoDay(Date.now() - 6 * 864e5);
    if (chip === '30d') from = isoDay(Date.now() - 29 * 864e5);
    S.from = from; S.to = to;
  }
  chipUI();
  loadFeed(true);
}

function chipUI() {
  document.querySelectorAll('#date-chips button').forEach(b =>
    b.classList.toggle('on', b.dataset.chip === S.chip));
  $('date-custom').style.display = S.chip === 'custom' ? 'flex' : 'none';
  if (S.chip !== 'custom') { $('f-from').value = S.from; $('f-to').value = S.to; }
}

function clearFilters() {
  S.sender = ''; S.media = ''; S.sort = 'desc'; S.q = '';
  $('q').value = ''; $('f-media').value = ''; $('f-sort').value = 'desc';
  $('f-sender').value = '';
  setDateChip('all');   // triggers reload
}

function setMode(mode) {
  if (S.mode === mode) return;
  S.mode = mode;
  document.querySelectorAll('#mode-seg button').forEach(b =>
    b.classList.toggle('on', b.dataset.mode === mode));
  loadFeed(true);
}

function runSearch() {
  S.q = $('q').value.trim();
  if (!S.q) { S.mode === 'browse' ? loadFeed(true) : setMode('browse'); return; }
  if (S.mode !== 'search') setMode('search'); else loadFeed(true);
}

// ---------------------------------------------------------------------------
// Ask AI
// ---------------------------------------------------------------------------
function mdToHtml(md) {
  const inline = t => esc(t)
    .replace(/\[({?\d+}?)\]/g, '<span class="cite">[$1]</span>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
  const lines = (md ?? '').replace(/\r/g, '').split('\n');
  let html = '', inList = null;
  const closeList = () => { if (inList) { html += `</${inList}>`; inList = null; } };
  for (const raw of lines) {
    const line = raw.trimEnd();
    if (/^(\s*)([-*])\s+/.test(line)) {
      if (inList !== 'ul') { closeList(); html += '<ul>'; inList = 'ul'; }
      html += '<li>' + inline(line.replace(/^\s*[-*]\s+/, '')) + '</li>';
    } else if (/^(\s*)\d+[.)]\s+/.test(line)) {
      if (inList !== 'ol') { closeList(); html += '<ol>'; inList = 'ol'; }
      html += '<li>' + inline(line.replace(/^\s*\d+[.)]\s+/, '')) + '</li>';
    } else if (/^#{1,4}\s+/.test(line)) {
      closeList(); html += '<h4>' + inline(line.replace(/^#{1,4}\s+/, '')) + '</h4>';
    } else if (line.trim() === '') {
      closeList(); html += '</p>';
    } else {
      if (html === '' || html.endsWith('</p>') || html.endsWith('</ul>') || html.endsWith('</ol>')) html += '<p>';
      html += inline(line) + ' ';
    }
  }
  closeList();
  return html.replace(/<p>\s*<\/p>/g, '').replace(/<\/p>(?=\S)/g, '</p>');
}

function miniCard(m, n) {
  return `<div class="msg-card mini" data-src="${n - 1}">
    <div class="msg-head"><span class="num">[${n}]</span>
      <span class="msg-grp" dir="auto">${esc(m.chat_title)}</span>
      <span class="msg-time">${fmtDate(m.date)}</span>
      <span dir="auto">${esc(m.sender_name || '')}</span>
      ${m.has_media ? '<span class="badge">🖼</span>' : ''}
    </div>
    <div class="msg-body" dir="auto">${esc((m.text || '').slice(0, 300))}</div>
  </div>`;
}

async function askAI() {
  const q = $('question').value.trim();
  if (!q) return;
  if (!aiConfigured) { toast('AI not configured - set AI_API_KEY in .env', 'err'); return; }
  const btn = $('ask-btn');
  btn.disabled = true; btn.textContent = 'Asking…';
  $('ask-log').textContent = '';
  $('answer').innerHTML = '<span class="placeholder">Thinking…</span>';
  $('sources').innerHTML = '';
  try {
    const r = await (await fetch('/api/ask', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q}),
    })).json();
    if (r.error) throw new Error(r.error);
    const kw = (r.keywords_tried || []).map(k => `<span class="kw">${k.map(esc).join(', ')}</span>`).join(' → ');
    $('ask-log').innerHTML = `searched: ${kw || '—'} · attempts: ${r.attempts}` +
      (r.fallback === 'recent' ? ' · <span class="kw">recent-messages fallback</span>' : '');
    $('answer').innerHTML = mdToHtml(r.answer || '');
    S.aiSources = r.sources || [];
    $('sources').innerHTML = S.aiSources.length
      ? `<h3>${S.aiSources.length} source${S.aiSources.length > 1 ? 's' : ''}</h3>` +
        S.aiSources.map((m, i) => miniCard(m, i + 1)).join('')
      : '';
  } catch (e) {
    $('answer').innerHTML = '<span style="color:var(--err)">' + esc(e.message) + '</span>';
  } finally {
    btn.disabled = false; btn.textContent = 'Ask';
  }
}

// ---------------------------------------------------------------------------
// Jobs: shared poller + drawer (queue-aware)
// ---------------------------------------------------------------------------
let jobWaiters = [];     // resolvers waiting for a job completion
let lastStatus = {running: false, name: '', log: '', queued: [], last_done: null};
let lastDoneSeen = null; // finished_at already handled (skip pre-existing on load)

async function fetchStatus() {
  lastStatus = await (await fetch('/api/job/status')).json();
  return lastStatus;
}

function logTail(n = 4) {
  return (lastStatus.log || '').trim().split('\n').slice(-n).join('\n');
}

function jobLabel(name) {
  return ({sync: 'Sync', track: 'Group backfill', dialogs: 'Group listing'})[name] || 'Job';
}

function ensurePolling() {
  if (pollTimer) return;
  const tick = async () => {
    try {
      const s = await fetchStatus();
      const queued = s.queued || [];
      $('sync-log').textContent = s.log || '(no job running)';
      $('sync-btn').disabled = s.running || queued.length > 0;
      $('sd-spin').style.display = s.running ? 'inline-block' : 'none';
      $('sd-stop').style.display = s.running ? 'inline-block' : 'none';
      $('sd-queued').innerHTML = queued.length
        ? `<span>${queued.length} job${queued.length > 1 ? 's' : ''} queued: ${queued.join(', ')} ` +
          '<button id="sd-cancel" class="stop-btn">cancel queued</button></span>'
        : '';
      const ml = document.getElementById('mm-log');
      if (ml) ml.textContent = s.log ? logTail() : '(starting…)';
      const done = s.last_done;
      if (done && done.finished_at && done.finished_at !== lastDoneSeen) {
        const first = (lastDoneSeen === null);
        lastDoneSeen = done.finished_at;
        if (!first) await onJobFinished(done);
      }
      if (!s.running && !queued.length) {
        clearInterval(pollTimer); pollTimer = null;
        const w = jobWaiters; jobWaiters = []; w.forEach(res => res());
      }
    } catch (e) { /* transient */ }
  };
  tick();
  pollTimer = setInterval(tick, 1200);
}

function waitJobDoneUI() {
  return new Promise(res => { jobWaiters.push(res); ensurePolling(); });
}

async function onJobFinished(done) {
  toast(`${jobLabel(done.name)} ${done.ok ? 'finished' : 'failed'}`, done.ok ? 'ok' : 'err');
  const w = jobWaiters; jobWaiters = []; w.forEach(res => res());
  await Promise.all([loadStats(), loadGroups()]);
  loadFeed(true);
  if (manageOpen) mmLoad();
}

async function startSync() {
  const wasBusy = lastStatus.running || (lastStatus.queued || []).length > 0;
  const r = await (await fetch('/api/sync', {method: 'POST'})).json();
  if (r.error) { toast(r.error, 'err'); return; }
  if (r.started === false) { toast('Sync is already queued', 'info'); openDrawer('Jobs'); ensurePolling(); return; }
  toast(wasBusy ? 'Sync queued — runs after the current job' : 'Sync started',
        wasBusy ? 'info' : 'ok');
  openDrawer('Jobs');
  ensurePolling();
}

async function stopJob() {
  try {
    const r = await (await fetch('/api/job/stop', {method: 'POST'})).json();
    toast(r.stopping ? 'Stopping at the next checkpoint — progress is saved' : 'Nothing to stop', 'info');
  } catch (e) { toast('Could not reach the server', 'err'); }
}

function openDrawer(title) {
  $('sync-drawer').hidden = false;
  $('sd-title').textContent = title || 'Job log';
}

// ---------------------------------------------------------------------------
// Manage groups modal
// ---------------------------------------------------------------------------
let mmWaiting = null;    // note shown while a Telegram listing is loading

function trackedSet() { return new Set(S.groups.map(g => g.chat_id)); }

function progressHTML(note) {
  return `<div class="mm-progress">
    <span class="spinner"></span>
    <div>
      <div class="mm-note">${esc(note)}</div>
      <pre id="mm-log">${esc(logTail())}</pre>
      ${lastStatus.running
        ? '<button id="mm-stop" class="stop-btn" style="margin-top:8px">■ stop current job</button>'
        : ''}
    </div>
  </div>`;
}

function trackedSectionHTML() {
  if (groupsError)
    return '<div class="mm-loading" style="color:var(--err)">Could not load groups from the server.<br>Check that the app is running, then reopen this dialog.</div>';
  if (!S.groups.length)
    return '<div class="mm-loading">No tracked groups yet — load the list below and tick the ones you want.</div>';
  return S.groups.map(g => `
    <div class="mm-row" style="cursor:default">
      <span class="g-ic">${g.kind === 'channel' ? '📣' : '👥'}</span>
      <div class="g-main">
        <div class="g-title" dir="auto">${esc(g.title)}</div>
        <div class="g-meta">${(g.message_count || 0).toLocaleString()} msgs${g.last_message ? ' · last ' + fmtDate(g.last_message) : ''}</div>
      </div>
      <button class="mm-untrack" data-id="${g.chat_id}">✕ untrack</button>
    </div>`).join('');
}

function dialogsSectionHTML() {
  if (mmWaiting) return progressHTML(mmWaiting);
  if (!dialogs)
    return '<div class="mm-load-wrap"><button id="mm-load" class="ghost-btn">Load groups from Telegram</button></div>';
  const tracked = trackedSet();
  const others = dialogs.filter(d => !tracked.has(d.chat_id));
  if (!others.length)
    return '<div class="mm-loading">All your Telegram groups are already tracked.</div>';
  return others.map(d => `
    <label class="mm-row">
      <input type="checkbox" data-id="${d.chat_id}">
      <span class="g-ic">${d.kind === 'channel' ? '📣' : '👥'}</span>
      <div class="g-main">
        <div class="g-title" dir="auto">${esc(d.title)}</div>
        <div class="g-meta">${d.chat_id}${d.username ? ' · @' + esc(d.username) : ''}</div>
      </div>
    </label>`).join('');
}

function setMmWaiting(note) { mmWaiting = note; renderManage(); }

function renderManage() {
  if (!manageOpen) return;
  $('mm-tracked').innerHTML = trackedSectionHTML();
  $('mm-dialogs').innerHTML = dialogsSectionHTML();
  $('mm-track').disabled = !!mmWaiting;   // running jobs are fine: new ones queue
  $('mm-track').textContent = mmWaiting ? 'Loading…' : 'Track selected';
  $('mm-refresh').disabled = !!mmWaiting;
  const loadBtn = document.getElementById('mm-load');
  if (loadBtn) loadBtn.addEventListener('click', () => mmLoad(true));
}

async function mmLoad(force = false) {
  if (!force) {
    try {
      const r0 = await (await fetch('/api/dialogs')).json();
      if (r0.ready) { dialogs = r0.dialogs; setMmWaiting(null); return; }
    } catch (e) { /* server hiccup - fall through to the retry loop */ }
  }
  setMmWaiting('Loading your groups from Telegram…');
  let tries = 0, netFails = 0;
  while (manageOpen) {
    try {
      const s = await fetchStatus();
      if (s.running || (s.queued || []).length) {
        const q = (s.queued || []).length;
        setMmWaiting(`Waiting for ${jobLabel(s.name || (s.queued || [])[0]).toLowerCase()}…` +
          (q ? ` (${q} in queue)` : '') + ' — stop it if you need the list now');
        await waitJobDoneUI();
        continue;
      }
      const rd = await (await fetch('/api/dialogs')).json();
      if (rd.ready) { dialogs = rd.dialogs; break; }
      if (++tries > 3) { toast('Could not load the group list from Telegram', 'err'); break; }
      await (await fetch('/api/dialogs', {method: 'POST'})).json();
      setMmWaiting('Fetching your group list from Telegram…');
      await waitJobDoneUI();
    } catch (e) {
      if (++netFails > 5) { toast('Lost connection to the server', 'err'); break; }
      await sleep(1500);
    }
  }
  setMmWaiting(null);
}

async function openManage() {
  manageOpen = true;
  $('manage-overlay').hidden = false;
  if (!S.groups.length) await loadGroups();   // re-attempt after server downtime
  renderManage();
  if (!dialogs) mmLoad();
}

function closeManage() {
  manageOpen = false;
  $('manage-overlay').hidden = true;
}

async function untrackIds(ids) {
  const r = await (await fetch('/api/groups/untrack', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({chat_ids: ids}),
  })).json();
  if (r.error) { toast(r.error, 'err'); return; }
  toast(`Untracked ${ids.length} group${ids.length > 1 ? 's' : ''}`, 'ok');
  await Promise.all([loadStats(), loadGroups()]);
  const rd = await (await fetch('/api/dialogs')).json();
  if (rd.ready) dialogs = rd.dialogs;
  else if (!dialogs) mmLoad();
  renderManage();
  loadFeed(true);
}

// ---------------------------------------------------------------------------
// Wire up events
// ---------------------------------------------------------------------------
$('group-filter').addEventListener('input', renderGroups);

$('group-list').addEventListener('click', e => {
  const row = e.target.closest('.group-row'); if (!row) return;
  const id = Number(row.dataset.id);
  if (S.selected.has(id)) S.selected.delete(id); else S.selected.add(id);
  renderGroups(); onScopeChange();
});
$('row-all').addEventListener('click', () => {
  S.selected.clear(); renderGroups(); onScopeChange();
});

$('feed').addEventListener('click', e => {
  const card = e.target.closest('.msg-card');
  if (!card) return;
  document.querySelectorAll('.msg-card.active').forEach(c => c.classList.remove('active'));
  card.classList.add('active');
  const m = S.feed.find(x => `${x.chat_id}:${x.msg_id}` === card.dataset.key);
  if (m) showDetails(m);
});

$('feed').addEventListener('scroll', () => {
  const f = $('feed');
  $('jump-top').classList.toggle('show', f.scrollTop > 600);
  if (S.mode === 'browse' && S.hasMore && !S.loading &&
      f.scrollTop + f.clientHeight > f.scrollHeight - 400) {
    loadFeed(false);
  }
});

$('jump-top').addEventListener('click', () => { loadFeed(true); $('feed').scrollTop = 0; });
$('load-more').addEventListener('click', () => loadFeed(false));

document.querySelectorAll('#mode-seg button').forEach(b =>
  b.addEventListener('click', () => setMode(b.dataset.mode)));
document.querySelectorAll('#date-chips button').forEach(b =>
  b.addEventListener('click', () => setDateChip(b.dataset.chip)));
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); runSearch(); } });

$('f-from').addEventListener('change', e => { S.from = e.target.value; S.chip = 'custom'; chipUI(); loadFeed(true); });
$('f-to').addEventListener('change', e => { S.to = e.target.value; S.chip = 'custom'; chipUI(); loadFeed(true); });
$('f-sender').addEventListener('change', e => { S.sender = e.target.value; loadFeed(true); });
$('f-media').addEventListener('change', e => { S.media = e.target.value; loadFeed(true); });
$('f-sort').addEventListener('change', e => { S.sort = e.target.value; loadFeed(true); });
$('clear-filters').addEventListener('click', clearFilters);

document.querySelectorAll('.rp-tab').forEach(b =>
  b.addEventListener('click', () => setTab(b.dataset.tab)));
$('rp-close').addEventListener('click', () => {
  if (matchMedia('(max-width: 1100px)').matches) document.body.classList.remove('rp-on');
  else document.body.classList.toggle('rp-off');
});
$('right-toggle').addEventListener('click', () => {
  if (matchMedia('(max-width: 1100px)').matches) document.body.classList.toggle('rp-on');
  else document.body.classList.toggle('rp-off');
});
$('nav-toggle').addEventListener('click', () => document.body.classList.toggle('sb-on'));

$('ask-btn').addEventListener('click', askAI);
$('question').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); askAI(); }
});
$('sources').addEventListener('click', e => {
  const c = e.target.closest('.msg-card'); if (!c) return;
  const m = S.aiSources[Number(c.dataset.src)];
  if (m) showDetails(m);
});

$('detail-copy').addEventListener('click', () => {
  if (!currentDetail) return;
  const text = currentDetail.text || '';
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => toast('Copied', 'ok'),
                                            () => toast('Copy failed', 'err'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied', 'ok'); }
    catch (e) { toast('Copy failed', 'err'); }
    ta.remove();
  }
});
$('detail-sender').addEventListener('click', async () => {
  if (!currentDetail || !currentDetail.sender_name) return;
  S.sender = currentDetail.sender_name;
  await loadSenders();
  $('f-sender').value = S.sender;
  loadFeed(true);
  toast('Filtered by sender', 'ok');
});

$('sync-btn').addEventListener('click', startSync);
$('sd-close').addEventListener('click', () => $('sync-drawer').hidden = true);
$('sd-stop').addEventListener('click', stopJob);
$('mm-dialogs').addEventListener('click', e => {
  if (e.target.closest('#mm-stop')) stopJob();
});
$('sd-queued').addEventListener('click', async e => {
  if (!e.target.closest('#sd-cancel')) return;
  try {
    const r = await (await fetch('/api/job/stop', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({clear_queue: true}),
    })).json();
    toast(r.cleared && r.cleared.length
      ? `Cancelled queued: ${r.cleared.join(', ')}`
      : 'Nothing queued', 'info');
  } catch (e) { toast('Could not reach the server', 'err'); }
});

$('manage-btn').addEventListener('click', openManage);
$('mm-close').addEventListener('click', closeManage);
$('manage-overlay').addEventListener('click', e => {
  if (e.target.id === 'manage-overlay') closeManage();
});
$('mm-track').addEventListener('click', async () => {
  const ids = [...document.querySelectorAll('#mm-dialogs input:checked')].map(i => Number(i.dataset.id));
  if (!ids.length) { toast('Tick the groups you want to track first', 'info'); return; }
  const r = await (await fetch('/api/groups/track', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({chat_ids: ids}),
  })).json();
  if (r.error) { toast(r.error, 'err'); return; }
  if (!r.started) {
    toast(r.reason === 'already_tracked' ? 'Already tracking those groups' : 'Could not start tracking', 'info');
    return;
  }
  const q = (r.queued_behind || []).length;
  toast(q > 0
    ? `Tracking ${r.chat_ids.length} group${r.chat_ids.length > 1 ? 's' : ''} — queued behind ${q} job${q > 1 ? 's' : ''}`
    : `Tracking ${r.chat_ids.length} group${r.chat_ids.length > 1 ? 's' : ''} — full history backfill in progress`,
    'ok');
  closeManage();
  openDrawer('Jobs');
  ensurePolling();
});
$('mm-tracked').addEventListener('click', e => {
  const btn = e.target.closest('.mm-untrack');
  if (!btn) return;
  if (btn.dataset.armed) { untrackIds([Number(btn.dataset.id)]); return; }
  btn.dataset.armed = '1';          // first click just asks for confirmation
  btn.classList.add('armed');
  btn.textContent = 'sure? ✓ click again';
  setTimeout(() => {
    if (!btn.isConnected) return;
    delete btn.dataset.armed;
    btn.classList.remove('armed');
    btn.textContent = '✕ untrack';
  }, 3500);
});
$('mm-refresh').addEventListener('click', () => mmLoad(true));

document.addEventListener('keydown', e => {
  const typing = /^(input|textarea|select)$/i.test(e.target.tagName);
  if (e.key === '/' && !typing) {
    e.preventDefault();
    setMode('search');
    $('q').focus();
  } else if (e.key === 'Escape') {
    if (manageOpen) closeManage();
    else if (!$('sync-drawer').hidden) $('sync-drawer').hidden = true;
    else if (document.body.classList.contains('sb-on')) document.body.classList.remove('sb-on');
    else if (document.body.classList.contains('rp-on')) document.body.classList.remove('rp-on');
  }
});

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------
(async () => {
  chipUI();
  loadStats();
  await loadGroups();
  setDateChip('all');   // triggers the first feed load
})();
</script>
</body>
</html>
