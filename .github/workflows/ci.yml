name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # Full end-to-end: the real app + a deterministic mock AI provider
  # against a synthetic archive (no real Telegram, no real LLM, no keys).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Seed demo archive
        run: python scripts/seed_demo.py --path data/e2e.db --messages 400
      - name: Start mock AI provider
        run: python scripts/mock_ai_server.py --port 8124 &
      - name: Start app
        run: |
          TG_DB_PATH=$PWD/data/e2e.db TG_SESSION_PATH=$PWD/data/e2e-session \
          TG_API_ID=123456 TG_API_HASH=e2e \
          AI_BASE_URL=http://127.0.0.1:8124/v1 AI_API_KEY=e2e \
          AI_MODEL=e2e-mock HOST=127.0.0.1 PORT=8123 \
          python app.py &
          sleep 8
        env:
          PYTHONUNBUFFERED: "1"
      - name: Run E2E suite
        run: python scripts/e2e_test.py --base http://127.0.0.1:8123 --db data/e2e.db
